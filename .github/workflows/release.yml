name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-zip:
    name: Publish release asset
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build integration ZIP
        run: >-
          git archive
          --format=zip
          --output="$RUNNER_TEMP/elco_aerotop.zip"
          HEAD:custom_components/elco_aerotop

      - name: Verify integration ZIP
        run: |
          unzip -t "$RUNNER_TEMP/elco_aerotop.zip"
          unzip -l "$RUNNER_TEMP/elco_aerotop.zip" | grep -q ' manifest.json$'

      - name: Create draft release with HACS ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "$RUNNER_TEMP/elco_aerotop.zip"
          --draft
          --generate-notes
          --title "${GITHUB_REF_NAME#v}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
